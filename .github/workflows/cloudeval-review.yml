name: Cloudeval infrastructure review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDEVAL_REVIEW_CONFIGURED: ${{ secrets.CLOUDEVAL_ACCESS_KEY != '' && secrets.CLOUDEVAL_PROJECT_ID != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Explain missing Cloudeval secrets
        if: env.CLOUDEVAL_REVIEW_CONFIGURED != 'true'
        run: |
          echo "Cloudeval review is skipped because CLOUDEVAL_ACCESS_KEY and CLOUDEVAL_PROJECT_ID are not configured."
          echo "Fork this repository, connect it to Cloudeval, then add those repository secrets to enable PR review comments."

      - name: Run Cloudeval review
        id: cloudeval
        if: env.CLOUDEVAL_REVIEW_CONFIGURED == 'true'
        uses: ganakailabs/cloudeval-action@v1
        with:
          access_key: ${{ secrets.CLOUDEVAL_ACCESS_KEY }}
          project_id: ${{ secrets.CLOUDEVAL_PROJECT_ID }}
          mode: review
          repo: ${{ github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          commit_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ai_summary: "true"
          github_checks: "true"
          sarif: "true"
          post_pr_comment: "true"
          upload_artifacts: "true"
          include_run_metadata: "true"
          review_wait_timeout_ms: "900000"
          review_poll_interval_ms: "5000"

      - name: Upload Cloudeval SARIF
        if: always() && steps.cloudeval.outputs.sarif_path != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.cloudeval.outputs.sarif_path }}
